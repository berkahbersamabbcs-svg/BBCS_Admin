<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
BBCS - Data Pinjaman
</title>

<link
    rel="stylesheet"
    href="../css/style.css"
>

</head>


<body>


<!-- =====================================
     HEADER
===================================== -->

<header>

    <h1>
        BERKAH BERSAMA
    </h1>

    <h2>
      CORE SYSTEM  
    </h2>

    <p>
    
          DATA PINJAMAN
    </p>

</header>


<!-- =====================================
     NAVIGASI
===================================== -->

<nav class="menu">

    <a href="../bbcs.html">
        🏠 Beranda
    </a>

</nav>


<!-- =====================================
     INPUT PINJAMAN
===================================== -->

<h3>
    💰 Input Pinjaman
</h3>


<div class="form">


<!-- =====================================
     PILIH ANGGOTA
===================================== -->

<label for="pilihAnggota">
    Pilih Anggota
</label>

<select id="pilihAnggota">

    <option value="">
        Pilih Anggota
    </option>

</select>


<!-- =====================================
     JUMLAH POKOK PINJAMAN
===================================== -->

<label for="jumlahPinjaman">
    Jumlah Pokok Pinjaman
</label>

<input
    id="jumlahPinjaman"
    type="text"
    inputmode="numeric"
    placeholder="Jumlah Pokok Pinjaman"
    autocomplete="off"
    oninput="
        formatJumlah(this);
        hitungTampilanAdministrasiBBCS();
    "
>


<!-- =====================================
     ADMINISTRASI PINJAMAN
===================================== -->

<h4>
    💼 Administrasi 
</h4>


<label for="tarifAdministrasiPinjaman">
    Tarif Administrasi (%)
</label>

<input
    id="tarifAdministrasiPinjaman"
    type="number"
    step="0.01"
    min="0"
    placeholder="Contoh: 2"
    autocomplete="off"
    oninput="
        ubahTampilanTarifAdministrasiBBCS();
    "
>


<label for="biayaAdministrasiPinjaman">
    Biaya Administrasi
</label>

<input
    id="biayaAdministrasiPinjaman"
    type="text"
    readonly
    placeholder="Otomatis"
>


<label for="uangDiterimaPinjaman">
    Uang Diterima Anggota
</label>

<input
    id="uangDiterimaPinjaman"
    type="text"
    readonly
    placeholder="Otomatis"
>


<!-- =====================================
     JASA MENURUN
===================================== -->

<label for="jasaPinjaman">
    Jasa Menurun (%)
</label>

<input
    id="jasaPinjaman"
    type="number"
    step="0.01"
    min="0"
    placeholder="Contoh: 5"
    autocomplete="off"
>


<!-- =====================================
     DENDA TUNGGAKAN
===================================== -->

<label for="dendaPinjaman">
    Denda Tunggakan (%)
</label>

<input
    id="dendaPinjaman"
    type="number"
    step="0.01"
    min="0"
    placeholder="Contoh: 2"
    autocomplete="off"
>


<!-- =====================================
     SIMPAN
===================================== -->

<button
    type="button"
    id="btnSimpanPinjaman"
    onclick="simpanPinjaman()"
>

    💾 SIMPAN PINJAMAN

</button>

</div>


<!-- =====================================
     DATABASE CORE
===================================== -->

<script
    src="../js/core/database.js">
</script>


<!-- =====================================
     HAK AKSES
===================================== -->

<script
    src="../js/auth/hakakses.js">
</script>


<!-- =====================================
     MESIN ADMINISTRASI PINJAMAN
===================================== -->

<script
    src="../js/pinjaman/administrasi.js">
</script>


<!-- =====================================
     MODUL PINJAMAN
===================================== -->

<script
    src="../js/pinjaman/pinjaman.js">
</script>


<!-- =====================================
     INISIALISASI
===================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function(){

        // ================================
        // PILIHAN ANGGOTA
        // ================================

        if(
            typeof tampilPilihanAnggota ===
            "function"
        ){

            tampilPilihanAnggota();

        }



        hitungTampilanAdministrasiBBCS();

    }
);


// =====================================
// HITUNG TAMPILAN ADMINISTRASI
// =====================================

function hitungTampilanAdministrasiBBCS(){

    const jumlahField =
        document.getElementById(
            "jumlahPinjaman"
        );

    const biayaField =
        document.getElementById(
            "biayaAdministrasiPinjaman"
        );

    const diterimaField =
        document.getElementById(
            "uangDiterimaPinjaman"
        );


    if(
        !jumlahField ||
        !biayaField ||
        !diterimaField
    ){

        return;

    }


    if(
        typeof window.hitungAdministrasiPinjamanBBCS
        !== "function"
    ){

        return;

    }


    const jumlah =
        typeof angkaNilai === "function"
            ? angkaNilai(
                jumlahField.value
            )
            : Number(
                String(
                    jumlahField.value
                ).replace(/\./g, "")
            );


    const hasil =
        window.hitungAdministrasiPinjamanBBCS(
            jumlah
        );


    biayaField.value =
        typeof rupiah === "function"
            ? rupiah(
                hasil.biayaAdministrasi
            )
            : hasil.biayaAdministrasi;


    diterimaField.value =
        typeof rupiah === "function"
            ? rupiah(
                hasil.uangDiterima
            )
            : hasil.uangDiterima;

}


// =====================================
// UBAH TARIF ADMINISTRASI
// =====================================

function ubahTampilanTarifAdministrasiBBCS(){

    const fieldTarif =
        document.getElementById(
            "tarifAdministrasiPinjaman"
        );


    if(!fieldTarif){

        return;

    }


    const tarif =
        Number(
            fieldTarif.value
        );


    if(
        !Number.isFinite(tarif) ||
        tarif < 0
    ){

        return;

    }


    if(
        typeof window.setTarifAdministrasiPinjamanBBCS
        === "function"
    ){

        window.setTarifAdministrasiPinjamanBBCS(
            tarif
        );

    }


    hitungTampilanAdministrasiBBCS();

}

</script>


</body>

</html>
