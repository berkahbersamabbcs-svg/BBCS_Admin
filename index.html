<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - BBCS</title>

<link rel="stylesheet" href="./css/style.css">

<link rel="manifest" href="./manifest.json">

</head>

<body>

<header>

<h1>BERKAH BERSAMA</h1>

<h2>CORE SYSTEM</h2>

<p>
Membangun Kebersamaan<br>
Menjaga Kepercayaan<br>
Meraih Keberkahan Bersama
</p>

</header>

<h3>LOGIN BBCS</h3>

<div class="form-container">

<label for="pin">
PIN ADMIN
</label>

<input
    type="password"
    id="pin"
    placeholder="Masukkan PIN"
    inputmode="numeric"
    autocomplete="off"
>

<button
    type="button"
    onclick="loginBBCS()"
>
🔐 LOGIN
</button>

</div>

<script src="js/auth/login.js"></script>

</body>

</html>
