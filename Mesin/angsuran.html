     ===================================== -->

<section class="info">

<h3>
PEMBAYARAN ANGSURAN
</h3>


<!-- =================================

     ================================= -->

<label>
Pilih Anggota
</label>

<select id="pilihAnggota">

<option value="">

</option>

</select>


<br><br>

<label>

</label>

<option value="">

</option>

</select>


<br><br>


<!-- =================================
     INPUT POKOK
     ================================= -->

<h3>
POKOK PEMBAYARAN
</h3>

<input
    type="text"
    id="inputPokok"
    inputmode="numeric"
    placeholder="Rp 0"
>


</section>


<!-- =====================================
     INFORMASI PINJAMAN
     ===================================== -->

<section
    class="info"
    id="infoPinjaman"
>

<h3>
INFORMASI PINJAMAN
</h3>


<div id="detailPinjaman">

Pilih pinjaman terlebih dahulu

</div>

</section>


<!-- =====================================
     KEWAJIBAN OTOMATIS
     ===================================== -->

<section
    class="info"
    id="hasilKewajiban"
>

<h3>
KEWAJIBAN PEMBAYARAN
</h3>


<div id="jasaWajib">

Jasa Wajib : Rp 0

</div>


<div id="dendaTunggakan">

Denda Tunggakan : Rp 0

</div>


<div id="jasaBerjalan">

Jasa Berjalan : Rp 0

</div>


<hr>


<div id="pokokBayar">

Pokok : Rp 0

</div>


<div id="totalKewajiban">

<b>
Total Kewajiban : Rp 0
</b>

</div>

</section>


<!-- =====================================
     TOMBOL BAYAR
     ===================================== -->

<section class="info">

<button
    type="button"
    id="btnBayar"
>

💰 BAYAR ANGSURAN

</button>

</section>
