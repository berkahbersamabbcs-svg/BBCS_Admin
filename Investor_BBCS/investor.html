<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta
name="viewport"
content="width=device-width, initial-scale=1.0"

«»

<title>BBCS - Investor</title><link
    rel="stylesheet"
    href="../css/style.css"
></head><body><!-- =====================================
     HEADER
===================================== --><header><h1>
    BERKAH BERSAMA
</h1>

<h2>
    CORE SYSTEM
</h2>

<p>
    💼 MODUL INVESTOR
</p>

</header><!-- =====================================
     BERANDA
     KEMBALI KE DASHBOARD UTAMA
===================================== --><div class="cardInvestor"><button
    type="button"
    class="btn-primary"
    onclick="berandaInvestorUI()"
>
    🏠 BERANDA
</button>

</div><!-- =====================================
     DATA INVESTOR
===================================== --><div
    id="bagianDataInvestor"
    class="cardInvestor"
><h3>
    👤 DATA INVESTOR
</h3>


<label for="namaInvestor">
    Nama Investor
</label>

<input
    id="namaInvestor"
    type="text"
    placeholder="Masukkan nama investor"
    autocomplete="off"
>


<label for="jasaInvestor">
    Jasa Investor (% / bulan)
</label>

<input
    id="jasaInvestor"
    type="number"
    min="0"
    step="0.01"
    placeholder="Contoh: 5"
    inputmode="decimal"
>


<button
    type="button"
    class="btn-primary"
    onclick="simpanInvestorUI()"
>
    💾 SIMPAN INVESTOR
</button>

</div><!-- =====================================
     TRANSAKSI INVESTOR
===================================== --><div
    id="bagianTransaksiInvestor"
    class="cardInvestor"
><h3>
    💳 TRANSAKSI INVESTOR
</h3>


<label
    for="jenisTransaksiInvestor"
>
    Pilih Transaksi
</label>


<select
    id="jenisTransaksiInvestor"
    onchange="ubahTransaksiInvestorUI()"
>

    <option value="">
        Pilih Transaksi
    </option>

    <option value="tambahModal">
        ➕ Tambah Modal
    </option>

    <option value="prosesJasa">
        📈 Proses Jasa
    </option>

    <option value="tarikJasa">
        💸 Tarik Jasa
    </option>

    <option value="tarikModal">
        🏦 Tarik Modal
    </option>

</select>

</div><!-- =====================================
     FORM TRANSAKSI
     
     AWAL:
     TERSEMBUNYI

     AKAN DIISI OTOMATIS
     OLEH investor.js
===================================== --><div
    id="formTransaksiInvestor"
    class="cardInvestor"
    style="display:none;"
></div><!-- 


<!-- =====================================
     DATABASE CORE
===================================== -->
<script src="../js/core/database.js"></script>

<!-- =====================================
     HAK AKSES
===================================== -->
<script src="../js/auth/hakakses.js"></script>

<!-- =====================================
     SECURITY
===================================== -->
<script src="../js/security/securityBBCS.js"></script>
<script src="../js/security/pengaman.js"></script>

<!-- =====================================
     TRANSAKSI CORE
===================================== -->
<script src="../js/transaksi/transaksi.js"></script>

<!-- =====================================
     KAS BBCS
===================================== -->
<script src="../js/kas/kas.js"></script>

<!-- =====================================
     MESIN INVESTOR
===================================== -->
<script src="mesin.js"></script>

<!-- =====================================
     KONEKTOR INVESTOR → KAS
===================================== -->
<script src="konektor.js"></script>

<!-- =====================================
     UI INVESTOR
===================================== -->
<script src="investor.js"></script>

</body>
</html>
